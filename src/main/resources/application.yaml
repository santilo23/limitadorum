spring:
  application:
    name: limitadorum
  profiles:
    # Perfil activo si no se indica otro por linea de comandos.
    default: dev
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000} # 24 horas (ms)
  remember-me-expiration: ${JWT_REMEMBER_ME_EXPIRATION:31536000000} # 1 año = 365 días (ms)

---
# PostgreSQL instalado en el sistema, administrado con pgAdmin (puerto 5432).
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/USERS_AUTH_DEV}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

---
# Base de produccion, tambien en el PostgreSQL del sistema (puerto 5432).
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/USERS_AUTH}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

---
# Contenedor de docker-compose (puerto 5433 en el host).
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/USERS_AUTH_DEV}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
