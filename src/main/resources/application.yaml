spring:
  application:
    name: limitadorum
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/limitadorum}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
