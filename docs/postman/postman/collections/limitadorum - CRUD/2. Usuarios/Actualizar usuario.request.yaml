$kind: http-request
url: "{{baseUrl}}/users/{{userId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "jperez",
      "email": "juan.perez@um.edu.ar",
      "active": false
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200 OK', function () { pm.response.to.have.status(200); });
      pm.test('Queda desactivado', function () { pm.expect(pm.response.json().active).to.eql(false); });
    language: text/javascript
order: 4000
