$kind: http-request
url: "{{baseUrl}}/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "jperez",
      "email": "jperez@um.edu.ar",
      "active": true,
      "roles": [
        { "id": {{roleId}} }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 201 Created', function () { pm.response.to.have.status(201); });
      var body = pm.response.json();
      pm.test('Tiene el rol asignado', function () { pm.expect(body.roles).to.have.lengthOf(1); });
      pm.collectionVariables.set('userId', body.id);
    language: text/javascript
order: 1000
