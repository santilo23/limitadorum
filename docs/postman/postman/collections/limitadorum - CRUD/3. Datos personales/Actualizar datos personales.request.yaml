$kind: http-request
url: "{{baseUrl}}/users-data/{{userDataId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "firstName": "Juan Carlos",
      "lastName": "Perez",
      "address": "Belgrano 456",
      "phoneNumber": "2617654321"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200 OK', function () { pm.response.to.have.status(200); });
      pm.test('Actualiza el domicilio', function () { pm.expect(pm.response.json().address).to.eql('Belgrano 456'); });
    language: text/javascript
order: 4000
